{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">

    <div class="auth-toggle">
        <button id="btn-login-view" class="active" onclick="toggleAuth('login')">Login</button>
        <button id="btn-reg-view" onclick="toggleAuth('register')">Register</button>
    </div>

    <div id="login-form">
        <h2 style="text-align: center;">Welcome Back</h2>
        <fieldset>
            <legend>Credentials</legend>
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
        </fieldset>
        
        <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        
        <p style="text-align: center; font-size: 0.8rem; margin-top: 15px; color: #64748b;">
            Secure Session • Rate Limited Access
        </p>
    </div>

    <div id="register-form" style="display: none;">
        <h2 style="text-align: center;">New Account</h2>
        
        <fieldset>
            <legend>Identity</legend>
            <input type="text" id="reg-username" placeholder="Username" required>
            <input type="email" id="reg-email" placeholder="Email Address" required>
        </fieldset>

        <fieldset>
            <legend>Security Access</legend>
            <input type="password" id="reg-password" placeholder="Password" required>
            <input type="password" id="reg-confirm" placeholder="Confirm Password" required>
        </fieldset>

        <fieldset>
            <legend>Recovery & Verification</legend>
            <select id="reg-question">
                <option value="" disabled selected>Select a Security Question</option>
                <option>What was your first pet's name?</option>
                <option>What city were you born in?</option>
                <option>What was your childhood nickname?</option>
                <option>What was the name of your first school?</option>
            </select>
            <input type="text" id="reg-answer" placeholder="Security Answer" required>
            <input type="email" id="reg-backup" placeholder="Backup Email (Optional)">
        </fieldset>

        <button class="btn-primary" onclick="handleRegister()">Register & Generate Key</button>
        
        <p style="text-align: center; font-size: 0.8rem; margin-top: 15px; color: #64748b;">
            Encryption Key (Mnemonic) will be generated upon success.
        </p>
    </div>

</div>

{% endblock %}
