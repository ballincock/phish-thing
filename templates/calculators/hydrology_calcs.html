{% extends "base.html" %}

{% block content %}
<div class="module-card" style="background:#121212; border:1px solid #2d2d2d; border-radius:12px; padding:25px;">
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
        <div style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); background: #1e1e1e; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
            ⚙️
        </div>
        <div>
            <h1 style="margin: 0; font-size: 1.8rem; color:#fff;">Hydrology Calculators</h1>
            <p style="margin: 2px 0 0 0; font-size: 0.95rem; color: #aaa;">
                Operator Code: <strong style="color: var(--primary);">{{ user.display_name or user.username }}</strong>
            </p>
        </div>
    </div>

    <div id="matrix-button-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;"></div>
</div>

<div id="matrixCalcModal" class="modal-overlay" style="background:rgba(0,0,0,0.85); display:none; position:fixed; inset:0; z-index:9999; justify-content:center; align-items:center;">
    <div class="modal-box" style="text-align:left; background:#121212; border:1px solid #2d2d2d; border-radius:12px; padding:25px; width:100%; max-width:500px; box-sizing:border-box;">
        <div id="matrixModalBody"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/calculators/hydrology_calcs.js') }}"></script>
{% endblock %}
