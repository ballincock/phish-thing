<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleStew</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/partials/style.css') }}">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
</head>
<body style="background: url('{{ url_for('static', filename='css/sigh.png') }}') no-repeat center center fixed; background-size: cover; margin: 0; padding: 0;">

    <div class="app-frame" style="ms-overflow-style:none !important; scrollbar-width:none !important; overflow-y:scroll !important;">
        {% block nav %}
            {% if request.endpoint != 'dash.index' %}
                <div class="nav-back-wrapper">
                    <button class="nav-back-btn" onclick="history.back()">← Back</button>
                </div>
            {% endif %}
        {% endblock %}

        <div class="content-area" style="ms-overflow-style:none !important; scrollbar-width:none !important; overflow-y:scroll !important;">
            
            {% block content %}{% endblock %}

            <div id="recommendation-space" style="display: none !important; margin: 25px auto 10px auto; max-width: 800px; padding: 15px; background: rgba(0, 0, 0, 0.85); border: 2px solid #ff7495; border-radius: 8px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,116,149,0.3); padding-bottom: 8px; margin-bottom: 12px;">
                    <h4 style="margin: 0; color: #ff7495; font-size: 13px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 10px;">
                        <span>💡 Suggested Modules For You</span>
                        <span id="output" style="font-size: 11px; font-weight: normal; text-transform: none; color: #777777;">Initializing...</span>
                    </h4>
                    <button id="dismiss-rec-space" style="background: transparent; color: #aaa; border: none; font-size: 13px; cursor: pointer; padding: 2px;">✕ Dismiss</button>
                </div>
                <div id="recommendation-space-links" style="display: flex; gap: 12px; flex-wrap: wrap;">
                </div>
            </div>

        </div>
    </div>

    <div id="mnemonicModal" class="modal-overlay">
        <div class="modal-box">
            <h2>🔐 Account Secured</h2>
            <p>Save this 16-word mnemonic safely. You cannot recover your account without it.</p>
            <div id="mnemonicText" class="mnemonic-display"></div>
            <button onclick="window.location.reload()" style="background: var(--primary); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">I have saved my words</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>

</body>
</html>
